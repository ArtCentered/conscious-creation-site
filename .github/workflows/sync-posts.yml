name: Sync Substack posts

on:
  schedule:
    # Daily at 16:00 UTC (09:00 Pacific), plus a Sunday pass shortly after the
    # weekly post lands at 13:35 UTC.
    - cron: "0 16 * * *"
    - cron: "30 14 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest posts
        run: python3 scripts/fetch_posts.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/posts.json; then
            echo "No new posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git commit -m "Sync latest Substack posts"
          git push
